<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Management Dashboard</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Real-time device management and control dashboard with gRPC streaming">
    <meta name="keywords" content="device management, remote control, gRPC, dashboard, real-time">
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Device Management Dashboard">
    <meta property="og:description" content="Real-time device management and control dashboard">
    <meta property="og:type" content="website">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#3b82f6">
    
    <!-- CSS Variables for theming -->
    <style>
      :root {
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --success-color: #10b981;
        --error-color: #ef4444;
        --warning-color: #f59e0b;
        --background-color: #f8fafc;
        --surface-color: #ffffff;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --border-color: #e5e7eb;
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        
        /* Terminal colors */
        --terminal-bg: #1a1a1a;
        --terminal-header: #2d2d2d;
        --terminal-border: #333;
        --terminal-text: #ffffff;
        --terminal-success: #10b981;
        --terminal-error: #ef4444;
        --terminal-info: #3b82f6;
      }

      [data-theme="dark"] {
        --background-color: #0f0f0f;
        --surface-color: #1a1a1a;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --border-color: #374151;
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
      }

      /* Loading animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--background-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--border-color);
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }

      .loading-text {
        color: var(--text-secondary);
        font-size: 16px;
        font-weight: 500;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Basic reset and global styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--background-color);
        color: var(--text-primary);
        line-height: 1.5;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--border-color);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }

      /* Selection colors */
      ::selection {
        background-color: var(--primary-color);
        color: white;
      }

      /* Focus styles for accessibility */
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
      }

      /* Print styles */
      @media print {
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Device Dashboard...</div>
    </div>

    <!-- Vue app mount point -->
    <div id="app"></div>

   
    <script type="module" src="/src/main.js"></script>

    <!-- Service Worker Registration (for PWA) -->
    <script>
      // Register service worker for PWA capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Hide loading screen when app is mounted
      window.addEventListener('DOMContentLoaded', () => {
        // This will be called when the Vue app mounts and removes the loading screen
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          // Add a fallback in case Vue takes too long to load
          setTimeout(() => {
            if (loadingScreen.parentNode) {
              loadingScreen.style.opacity = '0';
              setTimeout(() => {
                if (loadingScreen.parentNode) {
                  loadingScreen.remove();
                }
              }, 300);
            }
          }, 3000); // Maximum 3 seconds loading screen
        }
      });

      // Error handling for failed resource loading
      window.addEventListener('error', (e) => {
        console.error('Error loading resource:', e);
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.innerHTML = `
            <div style="text-align: center; color: var(--error-color);">
              <h2>Failed to load application</h2>
              <p>Please check your connection and try refreshing the page.</p>
              <button onclick="window.location.reload()" style="
                margin-top: 16px;
                padding: 8px 16px;
                background: var(--primary-color);
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
              ">Retry</button>
            </div>
          `;
        }
      }, true);
    </script>

    <!-- Fallback for non-JS browsers -->
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--background-color);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        z-index: 10000;
      ">
        <div>
          <h1 style="color: var(--text-primary); margin-bottom: 16px;">
            JavaScript Required
          </h1>
          <p style="color: var(--text-secondary); margin-bottom: 24px;">
            This application requires JavaScript to function properly. 
            Please enable JavaScript in your browser settings and refresh the page.
          </p>
          <p style="color: var(--text-secondary); font-size: 14px;">
            Device Management Dashboard &copy; 2024
          </p>
        </div>
      </div>
    </noscript>
  </body>
</html>
